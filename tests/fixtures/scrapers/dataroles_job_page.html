<html><head><script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Senior Manager, Data Analyst - Product Analytics","description":"Senior Manager, Data Analyst - Product Analytics<p><\/p><p><\/p><p>At Capital One, data is at the center of everything we do. When we launched as a startup we disrupted the credit card industry by individually personalizing every credit card offer using statistical modeling and the relational database, cutting edge technology in 1988! Fast-forward a few years, and this little innovation and our passion for data has skyrocketed us to a Fortune 200 company and a leader in the world of data-driven decision-making.<\/p><br><p>The Enterprise Data team is focused on maximizing the value of our data ecosystem and enabling real-time, intelligent experiences built on a scalable, future ready foundation. We are a highly collaborative, cross-functional team working across Product, Technology, Design, Risk, and other partners to build a modern enterprise data ecosystem.<br><br>We are looking for an exceptional and innovative Sr. Manager, Data Analytics to solve complex business and product challenges across our Enterprise Data Product teams. You will lead Product Analytics to measure and improve the performance and health of our Products and Platforms, transforming complex data into actionable, AI-enabled insights that shape product strategy and drive better decisions. If you are a strategic thinker who thrives on solving complex problems and using Data and AI to influence product development, this is an opportunity to make a meaningful impact.<\/p><br><p><b>On a given day you will be: <\/b><\/p><ul><li>Refining a new Enterprise-wide analytical tools validation framework <\/li><li>Planning and executing validation projects <\/li><li>Assessing the quality and risk of analytical tool methodologies across Capital One, and the nature of tools usage within those processes <\/li><li>Understanding technical issues in analytical tools and assessing tools risks and opportunities <\/li><li>Independently researching, identifying, and prototyping industry best practices for emerging analytical tools <\/li><li>Communicating results clearly and concisely both verbally and through written communications via validation reports and presentations <\/li><li>Leveraging education, colleagues and training opportunities to develop solutions to business problems <\/li><li>Coaching and mentoring junior staff <\/li><\/ul><br><p>An ideal candidate will possess strong problem solving and conceptual thinking abilities in addition to communication, interpersonal and leadership skills. This position will be in a fast-paced and entrepreneurial environment where you will be handling multiple concurrent projects while working independently and in teams. <\/p><br><p><b>Basic Qualifications:<\/b><\/p><ul><li>Currently has, or is in the process of obtaining a Bachelor’s Degree in quantitative field (Statistics, Economics, Operations Research, Analytics, Mathematics, Computer Science or a related quantitative field) plus at least 7 years of experience performing data analytics, or currently has, or is in the process of obtaining a Master’s Degree plus at least 5 years of experience performing data analytics with an expectation that required degree will be obtained on or before the scheduled start date.<\/li><li>At least 5 years of experience performing professional data analysis work<\/li><li>At least 5 years of experience leading and developing with open source data technologies <\/li><li>At least 2 years of experience managing people<\/li><\/ul><br><p><b>Preferred Qualifications: <\/b><\/p><ul><li>Master’s Degree or PhD in a Finance, Economics, Statistics, Mathematics, Industrial Engineering, Operations Research, or a related field <\/li><li>At least 7 years of experience in statistical or econometrics hands-on work <\/li><li>At least 5 years of experience manipulating and performing analysis with large data sets <\/li><li>At least 5 years of experience in financial services industry <\/li><li>At least 5 years of experience in developing statistical or econometric models <\/li><li>At least 5 years of experience in validating statistical or econometric models <\/li><li>At least 2 years of experience with data governance <\/li><li>At least 2 years of experience with predictive analytics <\/li><\/ul><br><p><b>Capital One will consider sponsoring a new qualified applicant for employment authorization for this position.<\/b><\/p><p><\/p><p>The minimum and maximum full-time annual salaries for this role are listed below, by location. Please note that this salary information is solely for candidates hired to perform work within one of these locations, and refers to the amount Capital One is willing to pay at the time of this posting. Salaries for part-time roles will be prorated based upon the agreed upon number of hours to be regularly worked.<\/p><p><\/p>McLean, VA: $200,700 - $229,100 for Sr. Data Analysis Manager<p><br> <\/p><p><br> <\/p><p><br> <\/p><p><br> <\/p><p><br> <\/p><p><br> <\/p><p><br> <\/p><p><br> <\/p><p><br> <\/p><p><br> <\/p><p><\/p><p>Candidates hired to work in other locations will be subject to the pay range associated with that location, and the actual annualized salary amount offered to any candidate at the time of hire will be reflected solely in the candidate’s offer letter.<\/p><p><\/p>This role is also eligible to earn performance based incentive compensation, which may include cash bonus(es) and/or long term incentives (LTI). Incentives could be discretionary or non discretionary depending on the plan.<p><\/p><p>Capital One offers a comprehensive, competitive, and inclusive set of health, financial and other benefits that support your total well-being. Learn more at the <a href=\"https://www.capitalonecareers.com/benefits\" rel=\"nofollow noopener\" target=\"_blank\">Capital One Careers website<\/a>. Eligibility varies based on full or part-time status, exempt or non-exempt status, and management level.<\/p><p><\/p>This role is expected to accept applications for a minimum of 5 business days.<p><\/p><p><\/p>No agencies please. Capital One is an equal opportunity employer (EOE, including disability/vet) committed to non-discrimination in compliance with applicable federal, state, and local laws.  Capital One promotes a drug-free workplace.  Capital One will consider for employment qualified applicants with a criminal history in a manner consistent with the requirements of applicable laws regarding criminal background inquiries, including, to the extent applicable, Article 23-A of the New York Correction Law; San Francisco, California Police Code Article 49, Sections 4901-4920; New York City’s Fair Chance Act; Philadelphia’s Fair Criminal Records Screening Act; and other applicable federal, state, and local laws and regulations regarding criminal background inquiries.<p><\/p><p><\/p><p>If you have visited our website in search of information on employment opportunities or to apply for a position, and you require an accommodation, please contact Capital One Recruiting at 1-800-304-9102 or via email at <a>RecruitingAccommodation&#64;capitalone.com<\/a>. All information you provide will be kept confidential and will be used only to the extent required to provide needed reasonable accommodations.<\/p><p><\/p><p>For technical support or questions about Capital One&#39;s recruiting process, please send an email to <a><u>Careers&#64;capitalone.com<\/u><\/a><\/p><p><\/p><p>Capital One does not provide, endorse nor guarantee and is not liable for third-party products, services, educational tools or other information available through this site.<\/p><p><\/p><p>Capital One Financial is made up of several different entities. Please note that any position posted in Canada is for Capital One Canada, any position posted in the United Kingdom is for Capital One Europe and any position posted in the Philippines is for Capital One Philippines Service Corp. (COPSSC).<\/p>","datePosted":"2026-10-05","hiringOrganization":{"@type":"Organization","name":"Capital One","sameAs":"https://capitalone.com","logo":"https://dataroles.co/logos/capital-one.webp"},"identifier":{"@type":"PropertyValue","name":"workday","value":"workday:capitalone/wd12/capital_one:R1001957"},"employmentType":"FULL_TIME","directApply":false,"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"McLean","addressCountry":"US"}},"baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","minValue":200700,"maxValue":229100,"unitText":"YEAR"}}}</script><script type="application/ld+json">{"@context":"https://schema.org/","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Jobs","item":"https://dataroles.co/"},{"@type":"ListItem","position":2,"name":"Data Analysis & BI jobs","item":"https://dataroles.co/data/data-analysis-bi-jobs"},{"@type":"ListItem","position":3,"name":"Senior Manager, Data Analyst - Product Analytics at Capital One"}]}</script></head><body></body></html>
