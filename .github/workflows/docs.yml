name: Documentation
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean
      - name: Verify build output
        run: |
          test -f _build/sitemap.xml || { echo "Error: sitemap.xml not found"; exit 1; }
          test -f _build/robots.txt || { echo "Error: robots.txt not found"; exit 1; }
          echo "Sitemap and robots.txt present"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build
      - uses: actions/deploy-pages@v5
        id: deployment
