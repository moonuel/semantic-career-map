[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-career-map"
version = "0.1.0"
description = "Semantic Career Mapping Platform — ML-powered resume-to-job matching"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0,<4.0",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.3,<2.0",
    "umap-learn>=0.5,<1.0",
    "matplotlib>=3.8,<4.0",
    "spacy>=3.7,<4.0",
    "pytrec-eval>=0.5,<1.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "scripts*"]
