[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-career-map"
version = "0.1.0"
description = "Semantic Career Mapping Platform — ML-powered resume-to-job matching"
requires-python = ">=3.14"
dependencies = [
    "sentence-transformers",
    "numpy",
    "scikit-learn",
    "umap-learn",
    "matplotlib",
    "spacy",
    "pytrec-eval",
    "httpx",
    "python-dotenv",
    "pytest",
    "boto3"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "scripts*"]
